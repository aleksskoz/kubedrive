name: update-tap

# Publishing a stable release points the Homebrew cask in aleksskoz/homebrew-tap
# at it. TAP_DEPLOY_KEY is a write deploy key of that repository.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: update-tap
  cancel-in-progress: false

jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kubedrive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aleksskoz/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG is not a stable version like v1.2.3"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "KubeDrive-$version.dmg.sha256" --dir "$RUNNER_TEMP"
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/KubeDrive-$version.dmg.sha256")
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::No SHA-256 in KubeDrive-$version.dmg.sha256"
            exit 1
          fi
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" \
            kubedrive/.github/kubedrive.rb.in > tap/Casks/kubedrive.rb

          cd tap
          git add Casks/kubedrive.rb
          if git diff --cached --quiet; then
            echo "cask already at $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kubedrive $version"
          git push
