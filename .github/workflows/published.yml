name: published

# Runs when a release is published:
# - appcast: puts the release notes into the release's Sparkle appcast, which
#   installed apps read from releases/latest/download/appcast.xml;
# - cask: points the Homebrew cask in aleksskoz/homebrew-tap at a stable
#   release. TAP_DEPLOY_KEY is a write deploy key of that repository.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: published-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write # replaces the appcast asset
    steps:
      - name: Add the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml; then
            echo "no appcast in $TAG"
            exit 0
          fi
          # The notes without the install instructions and editing hints.
          printf '%s\n' "$BODY" | sed '/^## Install/,$d' | sed '/^<!--.*-->$/d' > notes.md
          gh api markdown -f mode=gfm -f context="$GITHUB_REPOSITORY" -F text=@notes.md > notes.html
          python3 - <<'PY'
          import re
          html = open("notes.html").read().replace("]]>", "]]]]><![CDATA[>")
          xml = open("appcast.xml").read()
          xml = re.sub(r"\s*<description>.*?</description>", "", xml, flags=re.S)
          xml = xml.replace("</title>\n      <pubDate>",
                            "</title>\n      <description><![CDATA[" + html + "]]></description>\n      <pubDate>", 1)
          open("appcast.xml", "w").write(xml)
          PY
          grep -q "<description>" appcast.xml
          gh release upload "$TAG" appcast.xml --repo "$GITHUB_REPOSITORY" --clobber

  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kubedrive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aleksskoz/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $TAG is not a stable version like v1.2.3"
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "KubeDrive-$version.dmg.sha256" --dir "$RUNNER_TEMP"
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/KubeDrive-$version.dmg.sha256")
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::No SHA-256 in KubeDrive-$version.dmg.sha256"
            exit 1
          fi
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" \
            kubedrive/.github/kubedrive.rb.in > tap/Casks/kubedrive.rb

          cd tap
          git add Casks/kubedrive.rb
          if git diff --cached --quiet; then
            echo "cask already at $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kubedrive $version"
          git push
